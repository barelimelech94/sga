# Every push (including Claude's branches) builds a debug APK and publishes it
# as a GitHub release; the phone grabs it from releases/latest/download/sga.apk.
name: Phone build

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: phone-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Sign with the same debug key your Mac uses, so updates install over the
      # existing app instead of forcing an uninstall (which would wipe your workout data).
      # The path is passed to Gradle explicitly (app/build.gradle.kts); relying on
      # ~/.android/debug.keystore let AGP sign with a fresh random key on every build.
      - name: Restore debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the DEBUG_KEYSTORE_B64 repo secret first"; exit 1
          fi
          KS="$RUNNER_TEMP/sga-debug.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$KS"
          if ! keytool -list -keystore "$KS" -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            echo "::error::DEBUG_KEYSTORE_B64 is not a debug keystore (alias androiddebugkey, password android)"; exit 1
          fi
          FP=$(keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          echo "::notice::Keystore cert SHA-256: $FP"
          echo "SGA_DEBUG_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "SGA_KEY_SHA256=$FP" >> "$GITHUB_ENV"

      # gradle.properties pins a macOS Java path; point CI at its own JDK instead.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"

      # Never publish an APK the phone can't install as an update.
      - name: Check APK is signed with that key
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          GOT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "APK cert SHA-256: $GOT"
          if [ -z "$SGA_KEY_SHA256" ] || [ "$GOT" != "$SGA_KEY_SHA256" ]; then
            echo "::error::APK is not signed with the DEBUG_KEYSTORE_B64 key (apk=${GOT:-none} key=${SGA_KEY_SHA256:-none} apksigner=$APKSIGNER)"; exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same asset name every time, so this link always serves the newest build:
          # https://github.com/barelimelech94/sga/releases/latest/download/sga.apk
          TAG="build-${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk sga.apk
          gh release create "$TAG" sga.apk \
            --latest \
            --target "$GITHUB_SHA" \
            --title "$TAG (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}"
