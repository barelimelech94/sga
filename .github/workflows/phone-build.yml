# Every push (including Claude's branches) builds a debug APK and publishes it
# as a GitHub pre-release that Obtainium on the phone picks up.
name: Phone build

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: phone-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Sign with the same debug key your Mac uses, so updates install over the
      # existing app instead of forcing an uninstall (which would wipe your workout data).
      - name: Restore debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the DEBUG_KEYSTORE_B64 repo secret first"; exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk "sga-${TAG}.apk"
          gh release create "$TAG" "sga-${TAG}.apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$TAG (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}"
